<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Executive Analytics Portal</title>
    <!-- Plus Jakarta Sans Font & FontAwesome Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #ffffff;
            --primary: #0284c7;
            --primary-hover: #0369a1;
            --accent: #f8fafc;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius: 12px;
            --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(at 0% 0%, rgba(2, 132, 199, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(30, 41, 59, 0.8) 0px, transparent 50%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-card {
            background: var(--card-bg);
            width: 100%;
            max-width: 440px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 40px;
            position: relative;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #e0f2fe;
            color: #0369a1;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }

        .brand-header h1 {
            color: var(--text-main);
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            line-height: 1.2;
        }

        /* Tabs */
        .auth-tabs {
            display: flex;
            border-bottom: 2px solid #f1f5f9;
            margin-bottom: 24px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px 0;
            background: none;
            border: none;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            position: relative;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            color: var(--primary);
        }

        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: var(--primary);
        }

        /* Form Inputs */
        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 0.825rem;
            font-weight: 600;
            color: #334155;
            margin-bottom: 6px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper input {
            width: 100%;
            padding: 12px 14px;
            font-size: 0.95rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            color: var(--text-main);
        }

        .input-wrapper input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
        }

        /* Buttons */
        .btn {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background-color: var(--primary);
            color: #ffffff;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 20px 0;
            color: #94a3b8;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border);
        }

        .divider span {
            padding: 0 10px;
        }

        /* Guest / Demo Button */
        .btn-guest {
            background-color: #f1f5f9;
            color: #334155;
            border: 1px solid #cbd5e1;
        }

        .btn-guest:hover {
            background-color: #e2e8f0;
            color: var(--text-main);
        }

        .footer-note {
            text-align: center;
            margin-top: 20px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .footer-note a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .footer-note a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <!-- Brand Header -->
        <div class="brand-header">
            <div class="brand-badge"><i class="fa-solid fa-chart-line"></i> Enterprise Portal</div>
            <h1>Nonprofit Analytics</h1>
        </div>

        <!-- Auth Tabs -->
        <div class="auth-tabs">
            <button class="tab-btn active" id="tab-signin" onclick="switchTab('signin')">Sign In</button>
            <button class="tab-btn" id="tab-register" onclick="switchTab('register')">Create Account</button>
        </div>

        <!-- Sign In Form -->
        <form id="auth-form" onsubmit="handleFormSubmit(event)">
            <div class="form-group">
                <label for="email">Organization Email</label>
                <div class="input-wrapper">
                    <!-- Value attribute removed & placeholder added -->
                    <input type="email" id="email" placeholder="name@organization.org" required>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <!-- Value attribute removed & placeholder added -->
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary" id="submit-btn">
                <i class="fa-solid fa-right-to-bracket"></i> Sign In
            </button>
        </form>

        <!-- OR Divider -->
        <div class="divider">
            <span>Or Explore Sandbox</span>
        </div>

        <!-- Guest Sign In Button -->
        <button type="button" class="btn btn-guest" onclick="signInAsGuest()">
            <i class="fa-solid fa-user-shield"></i> Continue as Demo Guest
        </button>

        <div class="footer-note" id="footer-text">
            Need an account? <a href="#" onclick="switchTab('register')">Register Organization</a>
        </div>
    </div>

    <script>
        let currentMode = 'signin';

        function switchTab(mode) {
            currentMode = mode;
            const tabSignIn = document.getElementById('tab-signin');
            const tabRegister = document.getElementById('tab-register');
            const submitBtn = document.getElementById('submit-btn');
            const footerText = document.getElementById('footer-text');

            if (mode === 'signin') {
                tabSignIn.classList.add('active');
                tabRegister.classList.remove('active');
                submitBtn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Sign In';
                footerText.innerHTML = 'Need an account? <a href="#" onclick="switchTab(\'register\')">Register Organization</a>';
            } else {
                tabRegister.classList.add('active');
                tabSignIn.classList.remove('active');
                submitBtn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Register & Enter';
                footerText.innerHTML = 'Already registered? <a href="#" onclick="switchTab(\'signin\')">Sign In</a>';
            }
        }

        function signInAsGuest() {
            // Auto-fill seeded demo tenant credentials
            document.getElementById('email').value = 'admin@marylandcentral.org';
            document.getElementById('password').value = 'Password123!';
            
            // Set session storage flag for multi-tenant state
            sessionStorage.setItem('org_id', 'org_default');
            sessionStorage.setItem('user_role', 'guest_evaluator');

            // Redirect straight to executive dashboard UI
            window.location.href = 'index.html';
        }

        function handleFormSubmit(event) {
            event.preventDefault();
            // Store session org context and route to dashboard
            sessionStorage.setItem('org_id', 'org_default');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
